# Task definitions for skvk-mbp, included via [task_config] in mise.toml.
# Included files have no [tasks] prefix -- task names are top-level tables.

[verify]
description = "Apply into a throwaway HOME and assert the result"
dir = "{{config_root}}"
run = """
set -eu

FAKE=$(mktemp -d)
trap 'rm -rf "$FAKE"' EXIT

env HOME="$FAKE" SHELL=/bin/zsh mise trust "$MISE_CONFIG_ROOT" >/dev/null
env HOME="$FAKE" SHELL=/bin/zsh mise bootstrap dotfiles apply -y >/dev/null

fails=0
ran=0
pass() { ran=$((ran + 1)); echo "  ok    $1"; }
fail() { ran=$((ran + 1)); echo "  FAIL  $1"; fails=$((fails + 1)); }

# Assert a command succeeds inside a NON-login zsh using the throwaway HOME.
# env -i proves the shell starts from nothing. SHELL is required because
# ~/.sko/060-direnv.sh expands ${SHELL##*/} and errors when it is empty.
check() {
  if env -i HOME="$FAKE" SHELL=/bin/zsh TERM=xterm /bin/zsh -i -c "$2" >/dev/null 2>&1; then
    pass "$1"
  else
    fail "$1"
  fi
}

if env HOME="$FAKE" SHELL=/bin/zsh mise bootstrap dotfiles status | grep -q 'missing'; then
  fail "all declared dotfiles are applied"
else
  pass "all declared dotfiles are applied"
fi

# The status/grep check above passes vacuously if `status` prints nothing at
# all (e.g. a target's [dotfiles] entry is deleted outright), since there is
# then no "missing" line to find. These assert each target directly instead.
if [ -L "$FAKE/.zshrc" ]; then
  pass "~/.zshrc is a symlink"
else
  fail "~/.zshrc is a symlink"
fi

if [ -d "$FAKE/.zshrc.d" ]; then
  pass "~/.zshrc.d is a directory"
else
  fail "~/.zshrc.d is a directory"
fi

if [ -L "$FAKE/.config/starship.toml" ]; then
  pass "~/.config/starship.toml is a symlink"
else
  fail "~/.config/starship.toml is a symlink"
fi

if [ -f "$FAKE/.config/mise/conf.d/10-personal.toml" ] && [ ! -L "$FAKE/.config/mise/conf.d/10-personal.toml" ]; then
  pass "~/.config/mise/conf.d/10-personal.toml is a regular file"
else
  fail "~/.config/mise/conf.d/10-personal.toml is a regular file"
fi

if [ -L "$FAKE/.config/karabiner/karabiner.json" ]; then
  pass "~/.config/karabiner/karabiner.json is a symlink"
else
  fail "~/.config/karabiner/karabiner.json is a symlink"
fi

if [ -L "$FAKE/.config/alacritty/alacritty.toml" ]; then
  pass "~/.config/alacritty/alacritty.toml is a symlink"
else
  fail "~/.config/alacritty/alacritty.toml is a symlink"
fi

if [ -L "$FAKE/.aerospace.toml" ]; then
  pass "~/.aerospace.toml is a symlink"
else
  fail "~/.aerospace.toml is a symlink"
fi

if [ -L "$FAKE/.config/sketchybar" ]; then
  pass "~/.config/sketchybar is a symlink"
else
  fail "~/.config/sketchybar is a symlink"
fi

# The symlink means the repo file's mode is the mode sketchybar sees, so a lost
# executable bit is a silent breakage.
sketchybar_scripts=0
for f in files/config/sketchybar/sketchybarrc files/config/sketchybar/plugins/*.sh; do
  [ -e "$f" ] || continue
  sketchybar_scripts=$((sketchybar_scripts + 1))
  if [ -x "$f" ]; then
    pass "executable: $f"
  else
    fail "executable: $f"
  fi
done
[ "$sketchybar_scripts" -gt 0 ] || fail "at least one sketchybar script exists"

# The shell counterpart to the zsh -n checks on zshrc.d. -x so shellcheck
# follows the source directives into colors.sh.
sketchybar_shellcheck=0
for f in files/config/sketchybar/sketchybarrc files/config/sketchybar/colors.sh files/config/sketchybar/plugins/*.sh; do
  [ -e "$f" ] || continue
  sketchybar_shellcheck=$((sketchybar_shellcheck + 1))
  if shellcheck -x "$f" >/dev/null 2>&1; then
    pass "shellcheck: $f"
  else
    fail "shellcheck: $f"
  fi
done
[ "$sketchybar_shellcheck" -gt 0 ] || fail "at least one sketchybar script exists for shellcheck"

# Closes the audit gap that let a broken karabiner.json -- the file whose
# failure costs the whole keyboard, since every binding is ctrl-alt-cmd-* --
# reach a commit unchecked.
if /usr/bin/jq empty files/config/karabiner/karabiner.json 2>/dev/null; then
  pass "karabiner.json parses as JSON"
else
  fail "karabiner.json parses as JSON"
fi

# /usr/bin/python3 is 3.9 and has no tomllib -- a bare env -i shell resolves to
# it. Checked on its own so a missing tomllib fails loudly here rather than
# making the parse check below fail for the wrong reason.
if python3 -c 'import tomllib' 2>/dev/null; then
  pass "python3 has tomllib"
else
  fail "python3 has tomllib"
fi

if python3 -c 'import tomllib,sys; tomllib.load(open(sys.argv[1],"rb"))' files/aerospace.toml 2>/dev/null; then
  pass "aerospace.toml parses as TOML"
else
  fail "aerospace.toml parses as TOML"
fi

# The twelve workspace names are written in three places with nothing tying
# them together: the item loop in sketchybarrc, the repaint loop in
# workspaces.sh, and persistent-workspaces in aerospace.toml. Drift fails
# silently -- a name only in sketchybarrc yields an item workspaces.sh never
# repaints, so it stays dim forever even when focused; a name only in
# workspaces.sh targets an item that does not exist, which sketchybar does not
# report in any way the script would notice.
ws_sketchybarrc=$(grep -oE 'for ws in [0-9 A-Z]+' files/config/sketchybar/sketchybarrc | head -1 | sed 's/for ws in //')
ws_plugin=$(grep -oE 'for ws in [0-9 A-Z]+' files/config/sketchybar/plugins/workspaces.sh | head -1 | sed 's/for ws in //')
ws_aerospace=$(grep -E '^persistent-workspaces' files/aerospace.toml | grep -oE "'[0-9A-Z]+'" | tr -d "'" | tr '\n' ' ' | sed 's/ $//')

# -n guards against all three loops being gone: three empty strings compare
# equal to each other and would otherwise pass vacuously.
if [ -n "$ws_sketchybarrc" ] && [ "$ws_sketchybarrc" = "$ws_plugin" ] && [ "$ws_plugin" = "$ws_aerospace" ]; then
  pass "workspace lists agree across sketchybarrc, workspaces.sh and aerospace.toml"
else
  fail "workspace lists disagree: rc=[$ws_sketchybarrc] plugin=[$ws_plugin] aerospace=[$ws_aerospace]"
fi

# Every fragment parses as zsh, so one bad file cannot break every shell.
fragments=0
for f in files/zshrc.d/*.zsh; do
  [ -e "$f" ] || continue
  fragments=$((fragments + 1))
  if zsh -n "$f" 2>/dev/null; then
    pass "valid zsh: $f"
  else
    fail "valid zsh: $f"
  fi
done
[ "$fragments" -gt 0 ] || fail "at least one zshrc.d fragment exists"

# A clean non-login shell must start silently. Any stderr is a real defect:
# it would print on every new terminal. Runs before .zprofile is faked below.
noise=$(env -i HOME="$FAKE" SHELL=/bin/zsh TERM=xterm /bin/zsh -i -c 'true' 2>&1 || true)
if [ -z "$noise" ]; then
  pass "non-login shell starts with no output"
else
  fail "non-login shell starts with no output -- got: $noise"
fi

check "ll aliases ls -la" 'alias ll | grep -q "ls -la"'

# The guard is tested by behaviour, not by grepping .zshrc: the file's own
# explanatory comment contains the word HOMEBREW_PREFIX, so a text match passes
# even when the functional guard has been deleted.
printf 'export HOMEBREW_PREFIX=/opt/homebrew\\necho GUARD-FIRED\\n' > "$FAKE/.zprofile"
if env -i HOME="$FAKE" SHELL=/bin/zsh TERM=xterm /bin/zsh -i -c 'true' 2>&1 | grep -q GUARD-FIRED; then
  pass "guard sources .zprofile in a non-login shell"
else
  fail "guard sources .zprofile in a non-login shell"
fi

hits=$(env -i HOME="$FAKE" SHELL=/bin/zsh TERM=xterm /bin/zsh -l -i -c 'true' 2>&1 | grep -c GUARD-FIRED || true)
if [ "$hits" -eq 1 ]; then
  pass "guard does not re-source in login shells"
else
  fail "guard does not re-source in login shells (fired $hits times)"
fi
rm -f "$FAKE/.zprofile"

if env HOME="$FAKE" SHELL=/bin/zsh mise bootstrap dotfiles apply -y 2>&1 | grep -q "all files are applied"; then
  pass "re-apply is idempotent"
else
  fail "re-apply is idempotent"
fi

# A harness that silently runs zero checks must not report success. This floor
# is the count of checks that run today (5 zshrc.d fragments -> 5 "valid zsh:"
# lines; 7 sketchybar scripts -> 7 "executable:" lines; 8 -> 8 "shellcheck:"
# lines) -- bump it whenever a check above is added or removed, or it stops
# catching a deleted check.
if [ "$ran" -lt 38 ]; then
  echo "only $ran check(s) ran, expected at least 38"
  exit 1
fi
if [ "$fails" -ne 0 ]; then
  echo "$fails check(s) failed"
  exit 1
fi
echo "all $ran checks passed"
"""

# mise runs a task named `bootstrap` as the last phase of `mise bootstrap`.
# It is the documented escape hatch for setup the declarative sections cannot
# express -- here, a cask from a tap that publishes no API metadata.
[bootstrap]
description = "Install what the declarative sections cannot express"
dir = "{{config_root}}"
run = """
set -eu
if brew list --cask aerospace >/dev/null 2>&1; then
  echo "  ok    aerospace already installed"
else
  echo "  installing aerospace from nikitabobko/tap"
  brew install --cask nikitabobko/tap/aerospace
fi

if brew list sketchybar >/dev/null 2>&1; then
  echo "  ok    sketchybar already installed"
else
  echo "  installing sketchybar from FelixKratz/formulae"
  brew install FelixKratz/formulae/sketchybar
fi

# brew services, not [bootstrap.packages]: no declarative phase starts a launchd
# agent, which is why sketchybar joins aerospace in this task.
if brew services list | grep -qE '^sketchybar +started'; then
  echo "  ok    sketchybar service running"
else
  echo "  starting sketchybar service"
  brew services start sketchybar
fi
"""
