# Managed by skvk-mbp/mise.toml ([dotfiles]).
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

start-at-login = true

# Re-enabled after the 0.21.3 upgrade; it was unsupported in 0.20.3. Without it
# this config has no reload path at all, since service mode (which held the only
# reload-config binding) was cut.
auto-reload-config = true

# v2 requires this explicitly: the fallback became an empty array, and in v1 it
# was inferred from the bindings below.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'M', 'L', 'S']

default-root-container-layout = 'accordion'
default-root-container-orientation = 'vertical'

# 0 removes the slivers of adjacent windows. They exist to show a stack is
# there, but Caps+Up/Down walks the stack, so they are only lost pixels.
accordion-padding = 0

# Every workspace names its orientation explicitly, so none of this depends on
# default-root-container-orientation. Workspaces 1-3 are horizontal tiles, for
# terminals side by side, walked with Caps+, / Caps+. and reordered with Shift.
# The rest use a VERTICAL accordion, so each window gets full width and
# Caps+Up/Down walks the stack.
after-startup-command = [
    'layout --workspace 1 --root h_tiles',
    'layout --workspace 2 --root h_tiles',
    'layout --workspace 3 --root h_tiles',
    'layout --workspace 4 --root v_accordion',
    'layout --workspace 5 --root v_accordion',
    'layout --workspace 6 --root v_accordion',
    'layout --workspace 7 --root v_accordion',
    'layout --workspace 8 --root v_accordion',
    'layout --workspace 9 --root v_accordion',
    'layout --workspace M --root v_accordion',
    'layout --workspace L --root v_accordion',
    'layout --workspace S --root v_accordion',
]

[gaps]
    inner.horizontal = 4
    inner.vertical = 4
    outer.left = 0
    outer.bottom = 0
    outer.top = 0
    outer.right = 0

# --- Auto-float: small popup-style apps that look bad tiled. ---
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    if.window-title-regex-substring = '(Copy|Move|Empty Trash)'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.SystemProfiler'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Stickies'
    run = 'layout floating'

# --- Auto-route: pin specific apps to dedicated workspaces. ---
[[on-window-detected]]
    if.app-id = 'com.sublimemerge'
    run = 'move-node-to-workspace M'

[[on-window-detected]]
    if.app-id = 'com.linear'
    run = 'move-node-to-workspace L'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace S'

# Caps Lock sends ctrl-alt-cmd (see the Karabiner rule in this repo). Shift is
# deliberately NOT part of it, so it stays available for the move bindings.
[mode.main.binding]
    # Left/Right leave the workspace; Up/Down and , / . stay inside it.
    # next/prev walk all twelve persistent workspaces, the empty ones included.
    ctrl-alt-cmd-left  = 'workspace --wrap-around prev'
    ctrl-alt-cmd-right = 'workspace --wrap-around next'

    ctrl-alt-cmd-shift-left  = 'move-node-to-workspace --wrap-around prev'
    ctrl-alt-cmd-shift-right = 'move-node-to-workspace --wrap-around next'

    # The accordion is vertical, so these walk the window stack; --wrap-around
    # is what makes them cycle instead of stopping at the ends.
    ctrl-alt-cmd-up   = 'focus up --wrap-around'
    ctrl-alt-cmd-down = 'focus down --wrap-around'

    ctrl-alt-cmd-shift-up   = 'move up'
    ctrl-alt-cmd-shift-down = 'move down'

    # dfs-prev/dfs-next rather than focus left/right, because they mean
    # "previous and next window" under every layout: one pair of keys switches
    # windows in a tiling row and in an accordion stack alike. Shift reorders
    # the row, which only moves anything where windows sit side by side.
    ctrl-alt-cmd-comma  = 'focus dfs-prev --wrap-around'
    ctrl-alt-cmd-period = 'focus dfs-next --wrap-around'

    ctrl-alt-cmd-shift-comma  = 'move left'
    ctrl-alt-cmd-shift-period = 'move right'

    # The two-window toggle, distinct from walking the stack.
    ctrl-alt-cmd-tab = 'focus-back-and-forth'

    ctrl-alt-cmd-1 = 'workspace 1'
    ctrl-alt-cmd-2 = 'workspace 2'
    ctrl-alt-cmd-3 = 'workspace 3'
    ctrl-alt-cmd-4 = 'workspace 4'
    ctrl-alt-cmd-5 = 'workspace 5'
    ctrl-alt-cmd-6 = 'workspace 6'
    ctrl-alt-cmd-7 = 'workspace 7'
    ctrl-alt-cmd-8 = 'workspace 8'
    ctrl-alt-cmd-9 = 'workspace 9'
    ctrl-alt-cmd-0     = 'workspace M'
    ctrl-alt-cmd-minus = 'workspace L'
    ctrl-alt-cmd-equal = 'workspace S'

    ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'
    ctrl-alt-cmd-shift-7 = 'move-node-to-workspace 7'
    ctrl-alt-cmd-shift-8 = 'move-node-to-workspace 8'
    ctrl-alt-cmd-shift-9 = 'move-node-to-workspace 9'
    ctrl-alt-cmd-shift-0     = 'move-node-to-workspace M'
    ctrl-alt-cmd-shift-minus = 'move-node-to-workspace L'
    ctrl-alt-cmd-shift-equal = 'move-node-to-workspace S'

    ctrl-alt-cmd-q = 'close'
    ctrl-alt-cmd-f = 'fullscreen'
    ctrl-alt-cmd-space = 'layout floating tiling'
